[package]
name = "ortheon-desktop"
version = "0.1.0"
description = "Ortheon Engineering Inspector desktop shell"
authors = ["Ortheon Contributors"]
edition = "2021"

[lib]
name = "ortheon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
